[project]
name = "agrosense"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = ["apps/*"]

[dependency-groups]
dev = [
    "ruff",
    "pytest",
    "pytest-cov",
    "pre-commit",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]   # S = reglas de seguridad (bandit)

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]                   # permite assert en pruebas

[tool.pytest.ini_options]
testpaths = ["apps", "tests"]
pythonpath = ["."]
addopts = "--cov=apps --cov=scripts --cov-report=term-missing"
