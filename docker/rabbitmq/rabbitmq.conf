# ============================================================================
# AgroSense Café — RabbitMQ Broker Configuration
# File: /docker/rabbitmq/rabbitmq.conf
# ============================================================================

# Network & Listeners
listeners.tcp.default = 5672
management.tcp.port = 15672

# Default Virtual Host & Credentials
default_vhost = /
default_user = agrosense
default_pass = agrosense_password
default_user_tags.administrator = true

# Automatic Definition Loading
# Pre-configures users, vhosts, exchanges, queues, and bindings on startup
management.load_definitions = /etc/rabbitmq/definitions.json

# Resource Limits & Flow Control
vm_memory_high_watermark.relative = 0.7
disk_free_limit.relative = 1.0

# Logging
log.console = true
log.console.level = info
